name: Build & Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME=$JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "Error: JAVA_HOME is not set."
            exit 1
          fi

          JAVA_MAJOR_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{if ($1 == "1") {print $2} else {print $1}}')
          echo "Detected Java major version: '$JAVA_MAJOR_VERSION'"

          if [ -z "$JAVA_MAJOR_VERSION" ] || ! [[ "$JAVA_MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "Error: Unable to detect active Java major version."
            exit 1
          fi

          if [ "$JAVA_MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Active Java version ($JAVA_MAJOR_VERSION) is lower than 17. Java 17 or newer is required."
            exit 1
          fi

          echo "Confirmed: Java major version $JAVA_MAJOR_VERSION is 17 or newer."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "debug.keystore already exists. Skipping generation."
          elif [ -f "./debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d ./debug.keystore.base64 > "$KEYSTORE_PATH"
          else
            echo "debug.keystore not found. Generating temporary debug keystore using Java 17 keytool..."
            "$JAVA_HOME/bin/keytool" -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -alias "androiddebugkey" \
              -storepass "android" \
              -keypass "android" \
              -keyalg "RSA" \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Error: debug.keystore could not be found or created at $KEYSTORE_PATH"
            exit 1
          fi
          echo "Confirmed: ./debug.keystore exists and is ready for debug signing."

          # Ensure .env exists so secrets Gradle plugin has a valid file during build
          if [ ! -f "./.env" ]; then
            echo "Creating fallback .env from .env.example..."
            if [ -f "./.env.example" ]; then
              cp ./.env.example ./.env
            else
              touch ./.env
            fi
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK not found at: $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk for available APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: Found APK at $EXPECTED_APK but it is empty (0 bytes)."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "Error: File $EXPECTED_APK does not have .apk extension."
              exit 1
              ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Selected APK is not exactly app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$EXPECTED_APK" 2>/dev/null || wc -c < "$EXPECTED_APK")
          echo "Verified debug APK exists: $EXPECTED_APK (Size: $APK_SIZE bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SRC_APK" ]; then
            echo "Error: Source APK $SRC_APK not found."
            exit 1
          fi

          TMP_DIR="${RUNNER_TEMP:-/tmp}/release-asset-${{ github.run_id }}"
          rm -rf "$TMP_DIR"
          mkdir -p "$TMP_DIR"

          RAW_REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "$RAW_REPO_NAME" ]; then
            RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          fi

          CLEAN_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | sed 's/-\{2,\}/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$CLEAN_REPO_NAME" ]; then
            CLEAN_REPO_NAME="android-app"
          fi

          ASSET_FILENAME="${CLEAN_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_APK="$TMP_DIR/$ASSET_FILENAME"

          cp "$SRC_APK" "$DEST_APK"

          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ]; then
            echo "Error: Failed to copy release APK asset to $DEST_APK"
            exit 1
          fi

          echo "Prepared release asset: $DEST_APK"
          echo "Asset filename: $ASSET_FILENAME"
          echo "asset_path=$DEST_APK" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Verifying GitHub CLI ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset does not exist at '$ASSET_PATH'"
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is empty (0 bytes)."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "Error: Prepared release asset does not have .apk extension."
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          RELEASE_NOTES=$(cat <<'EOF'
          ### 🤖 Maya AI - Automated Debug APK Build

          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.

          - **Workflow Run Number:** #${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Commit SHA:** `${{ github.sha }}`
          - **Build Artifact:** `${{ steps.prepare_asset.outputs.asset_name }}`

          > ⚠️ **Notice:**
          > - The APK is intended for testing and development preview.
          > - The APK is not a Play Store production release.
          > - The APK is signed only with a temporary debug keystore.
          EOF
          )

          echo "Creating GitHub Release with tag: $RELEASE_TAG and asset: $ASSET_PATH"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_OUTCOME="${{ steps.create_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          echo "=============================================="
          echo "           APK BUILD & RELEASE SUMMARY        "
          echo "=============================================="

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "STATUS: GitHub Release published successfully!"
            gh release view "$RELEASE_TAG"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG")

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            echo ""
            echo "The APK file can be downloaded directly from the release Assets section on your phone or PC."
            echo "Note: The GitHub Actions workflow artifact 'app-debug-apk' is also available as a backup."

            {
              echo "## 🚀 Debug APK Build & Release Summary"
              echo ""
              echo "✅ **Debug APK built successfully!**"
              echo "✅ **Published to GitHub Releases:** [$RELEASE_TAG]($RELEASE_URL)"
              echo ""
              echo "### 📱 Download & Install"
              echo "- **Direct Download:** Download \`$ASSET_NAME\` directly from the [GitHub Release Page]($RELEASE_URL) under **Assets**."
              echo "- **Actions Artifact Backup:** The \`app-debug-apk\` artifact is also preserved in this workflow run."
              echo ""
              echo "### ℹ️ Build Details"
              echo "- **Run Number:** #${{ github.run_number }}"
              echo "- **Run Attempt:** ${{ github.run_attempt }}"
              echo "- **Commit:** \`${{ github.sha }}\`"
              echo "- **Signed With:** Temporary Debug Keystore"
            } >> "$GITHUB_STEP_SUMMARY"

          else
            echo "WARNING: GitHub Release creation did not succeed or was skipped."
            echo "Note: The debug APK was built successfully."
            echo "The GitHub Actions workflow artifact 'app-debug-apk' remains available for download."

            {
              echo "## ⚠️ Debug APK Build Summary"
              echo ""
              echo "✅ **Debug APK was built successfully!**"
              echo "⚠️ **GitHub Release publishing did not complete.**"
              echo ""
              echo "### 📦 Backup Download"
              echo "The debug APK is preserved as a standard GitHub Actions artifact named **app-debug-apk**."
              echo "You can download it from the **Artifacts** section at the bottom of this workflow run page."
              echo ""
              echo "### ℹ️ Build Details"
              echo "- **Run Number:** #${{ github.run_number }}"
              echo "- **Run Attempt:** ${{ github.run_attempt }}"
              echo "- **Commit:** \`${{ github.sha }}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
